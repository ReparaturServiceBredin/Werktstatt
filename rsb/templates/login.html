<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anmelden</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="anmeldung">
  <img src="{{ url_for('static', filename='bilder/logo_standard.png') }}" alt="Logo">
  <div class="karte">
    <h1>Anmelden</h1>
    {% with meldungen = get_flashed_messages(with_categories=true) %}{% for art, text in meldungen %}<div class="meldung {{ art }}">{{ text }}</div>{% endfor %}{% endwith %}
    <form method="post">
      <label>Passwort</label><input type="password" name="passwort" required autofocus>
      <br><br><button>Anmelden</button>
    </form>
  </div>
</div>
</body></html>
