name: Reifen & Teile – Windows-EXE bauen und veröffentlichen

# Variante „Reifen & Teile“ (rsb/variante.py). Eine neue Veröffentlichung entsteht nur, wenn es zur Versionsnummer
# noch keinen Tag „reifen-v…“ gibt. Diese Releases sind nie „latest“, damit Werkstatt Sauter (Tags „v…“) ungestört bleibt.
on:
  push:
    branches: [main, claude/optimistic-maxwell-du57gi]
    paths:
      - "rsb/**"
      - "start_exe.py"
      - "start_exe_reifen.py"
      - "Reifen-Teile.spec"
      - "requirements.txt"
      - "bauen/**"
      - "docs/AENDERUNGEN_REIFEN.md"
      - ".github/workflows/release-reifen.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: "Europe/Berlin"  # Tests mit deutscher Zeit (sonst scheitern sie zwischen 0 und 2 Uhr am Datumswechsel)
  PYTHONUTF8: "1"   # Umlaute/Sonderzeichen in Python-Ausgaben auch unter Windows

concurrency:
  group: release-reifen
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows-exe:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version ermitteln
        id: v
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python bauen/version_info.py reifen)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "reifen-v$V" > /dev/null 2>&1; then echo "neu=nein" >> "$GITHUB_OUTPUT"; else echo "neu=ja" >> "$GITHUB_OUTPUT"; fi
          echo "Version $V"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.8

      - name: EXE bauen
        run: pyinstaller --noconfirm --clean Reifen-Teile.spec

      - name: EXE testen (startet sie und fragt die Version ab)
        shell: pwsh
        run: |
          $env:RSB_DATEN = "$env:RUNNER_TEMP\testdaten"
          $env:RSB_KEIN_BROWSER = "1"
          $env:RSB_KEIN_UPDATE = "1"
          $env:RSB_PORT = "5078"
          $p = Start-Process -FilePath "dist\Reifen-Teile.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-RestMethod -Uri "http://127.0.0.1:5078/version" -TimeoutSec 3
              if ($r.version -eq "${{ steps.v.outputs.version }}" -and $r.programm -eq "Reifen & Teile") { $ok = $true; break }
            } catch { }
          }
          $seite = (Invoke-WebRequest -Uri "http://127.0.0.1:5078/einrichten" -UseBasicParsing).StatusCode
          Get-Process -Name "Reifen-Teile" -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok -or $seite -ne 200) { Write-Error "EXE startet nicht korrekt"; exit 1 }
          Write-Host "EXE läuft: Version ${{ steps.v.outputs.version }}, Startseite $seite"

      - name: Prüfsumme
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\Reifen-Teile.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Reifen-Teile.exe" | Out-File -Encoding ascii -NoNewline dist\Reifen-Teile.exe.sha256
          Get-Content dist\Reifen-Teile.exe.sha256

      - name: Ordner für den USB-Stick packen
        shell: pwsh
        run: |
          $ordner = "dist\usb\Reifen und Teile"
          New-Item -ItemType Directory -Force -Path $ordner | Out-Null
          Copy-Item dist\Reifen-Teile.exe $ordner
          Copy-Item "bauen\usb_reifen\*" $ordner
          Compress-Archive -Path $ordner -DestinationPath dist\Reifen-Teile-USB.zip -Force
          Get-ChildItem $ordner

      - name: EXE als Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: Reifen-Teile-${{ steps.v.outputs.version }}
          path: |
            dist/Reifen-Teile.exe
            dist/Reifen-Teile.exe.sha256
            dist/Reifen-Teile-USB.zip

      - name: Veröffentlichen (nur bei neuer Versionsnummer)
        if: steps.v.outputs.neu == 'ja'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          python bauen/release_notes.py "$V" docs/AENDERUNGEN_REIFEN.md
          gh release create "reifen-v$V" dist/Reifen-Teile.exe dist/Reifen-Teile.exe.sha256 dist/Reifen-Teile-USB.zip \
            --title "Reifen & Teile $V" --notes-file release_notes.md --target "${{ github.sha }}" --latest=false
